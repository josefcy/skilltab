[package]
name = "skilltab-core"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
memchr = "2.8.3"
rayon = "1.12.0"
rusqlite = { version = "0.42.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
specta = { version = "=2.0.0-rc.28", features = ["derive"] }
toml = "0.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_UI_Shell"] }

[target.'cfg(not(windows))'.dependencies]
trash = "5.3.0"

[dev-dependencies]
tempfile = "3"
