[package]
name = "skilltab"
version = "0.1.0"
description = "See and manage every agent skill installed on this machine"
authors = ["skilltab"]
edition = "2024"

[lib]
# The `_lib` suffix is needed to keep the lib name unique from the bin name on Windows.
# See https://github.com/rust-lang/cargo/issues/8519
name = "skilltab_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
skilltab-core = { path = "../crates/core" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
specta = { version = "=2.0.0-rc.28", features = ["derive"] }
specta-typescript = "0.0.15"
tauri-specta = { version = "=2.0.0-rc.29", features = ["derive", "typescript"] }
